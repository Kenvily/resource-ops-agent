[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu-resource-center"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "pydantic-settings>=2.6,<3", "psycopg[binary,pool]>=3.2.13,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1", "mypy>=1.15,<3"]

[tool.setuptools.package-data]
app = ["fixtures/*.json", "agents/fixtures/*.json", "history/*.sql", "history/migrations/*.sql"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110


[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
explicit_package_bases = true
ignore_missing_imports = true
