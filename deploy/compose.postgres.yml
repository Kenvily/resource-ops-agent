# Run: docker compose --env-file .env -f deploy/compose.postgres.yml up -d
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: gpu_history
      POSTGRES_USER: gpu_history
      POSTGRES_PASSWORD: ${HISTORY_POSTGRES_PASSWORD:?Set HISTORY_POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - gpu-history:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gpu_history -d gpu_history"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  gpu-history:
